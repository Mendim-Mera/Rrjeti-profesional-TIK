<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORARI MËSIMOR</title>
<meta name="description" content="Orari mësimor 2026–2027 · Gjimnazi &quot;Said Najdeni&quot;, Peshkopi">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gjimnazi &quot;Said Najdeni&quot;">
<meta property="og:title" content="ORARI MËSIMOR">
<meta property="og:description" content="Gjimnazi &quot;Said Najdeni&quot; · Viti shkollor 2026–2027">
<meta property="og:url" content="https://mendim-mera.github.io/ORARI-MESIMOR/">
<meta property="og:image" content="https://mendim-mera.github.io/ORARI-MESIMOR/stema.jpg">

<meta property="og:image:height" content="445">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/jpeg" href="stema.jpg">
<link rel="apple-touch-icon" href="stema.jpg">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e14;--surface:#141720;--surface2:#1c1f2d;
  --border:rgba(255,255,255,0.09);
  --gold:#f0b429;--gold-dim:rgba(240,180,41,0.13);--gold-glow:rgba(240,180,41,0.28);
  --teal:#38d9d0;--teal-dim:rgba(56,217,208,0.11);--teal-glow:rgba(56,217,208,0.3);
  --text:#eceaf4;--text-dim:#9b98aa;--text-faint:#5a5870;
}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
body::before{content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);width:800px;height:500px;background:radial-gradient(ellipse,rgba(240,180,41,0.06) 0%,transparent 70%);pointer-events:none}
.page{position:relative;width:100%;max-width:820px;padding:40px 18px}
.hdr{text-align:center;margin-bottom:34px;animation:fadeDown .5s ease both}
.logo{width:40px;height:40px;border-radius:50%;display:block;margin:0 auto 18px;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 8px 30px rgba(0,0,0,.45)}
.school{font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px}
.badge{display:inline-flex;background:var(--gold-dim);border:1px solid var(--gold-glow);color:var(--gold);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;padding:5px 15px;border-radius:20px;margin-bottom:16px}
h1{font-size:clamp(26px,6vw,40px);font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
.hdr p{font-size:15px;color:var(--text-dim);line-height:1.6}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px 24px;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;animation:fadeUp .5s ease both}
.card:nth-child(2){animation-delay:.1s}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none}
.card.a:hover,.card.a:focus-visible{border-color:var(--gold-glow);box-shadow:0 10px 40px rgba(240,180,41,.12);background:var(--surface2)}
.card.b:hover,.card.b:focus-visible{border-color:var(--teal-glow);box-shadow:0 10px 40px rgba(56,217,208,.1);background:var(--surface2)}
.ico{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:6px}
.a .ico{background:var(--gold-dim);border:1px solid var(--gold-glow)}
.b .ico{background:var(--teal-dim);border:1px solid var(--teal-glow)}
.card h2{font-size:22px;font-weight:700;line-height:1.2}
.card .days{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.5px}
.a .days{color:var(--gold)}.b .days{color:var(--teal)}
.card p{font-size:14px;color:var(--text-dim);line-height:1.55;flex:1}
.go{font-size:14px;font-weight:600;margin-top:6px}
.a .go{color:var(--gold)}.b .go{color:var(--teal)}
footer{text-align:center;margin-top:40px;color:var(--text-faint);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:1.5px;opacity:.6}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:600px){
  body{min-height:100vh;min-height:100dvh}
  .page{padding:14px 12px}
  .hdr{margin-bottom:14px}
  .logo{width:32px;height:32px;margin-bottom:8px}
  .school{font-size:13px;margin-bottom:8px}
  .badge{font-size:9px;letter-spacing:1.5px;padding:4px 11px;margin-bottom:8px}
  h1{font-size:24px;margin-bottom:4px}
  .hdr p{font-size:13px;line-height:1.3}
  .cards{grid-template-columns:1fr;gap:10px}
  .card{flex-direction:row;align-items:center;gap:12px;padding:14px;border-radius:14px}
  .ico{width:42px;height:42px;font-size:20px;margin-bottom:0;flex-shrink:0;border-radius:11px}
  .card h2{font-size:16px;flex:1}
  .go{font-size:13px;margin-top:0;white-space:nowrap}
  footer{margin-top:14px;font-size:9px}
}
@media(max-width:600px) and (max-height:620px){
  .logo{display:none}
  .card{padding:10px 12px}
  .hdr{margin-bottom:10px}
}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <img class="logo" src="stema.jpg" alt="Stema e Gjimnazit &quot;Said Najdeni&quot;">
    <div class="school">Gjimnazi &quot;Said Najdeni&quot; &middot; Peshkopi</div>
    <div class="badge">&#9670; Viti Akademik 2026–2027 &#9670;</div>
    <h1>ORARI MËSIMOR</h1>
    <p>Zgjidh orarin që të duhet.</p>
  </div>
  <div class="cards">
    <a class="card a" href="orari_dita.html">
      <div class="ico">&#128197;</div>
      <h2>Orari i ditës</h2>
      <div class="go">Hap orarin &rarr;</div>
    </a>
    <a class="card b" href="orari_kp.html">
      <div class="ico">&#128338;</div>
      <h2>Orari i kohës së pjesshme</h2>
      <div class="go">Hap orarin &rarr;</div>
    </a>
  </div>
  <footer>&#9670; ORARI MËSIMOR 2026–2027 &#9670;</footer>
</div>
</body>
</html>
